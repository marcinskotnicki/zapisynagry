<svg xmlns="http://www.w3.org/2000/svg" width="240" height="18" viewBox="0 0 240 18">
  <!-- Horizontal flourish: a stem that tapers from both edges into a central
       leaf pair. Used under card headings and between table sections. -->
  <g fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round">
    <path d="M4 9 H96"/>
    <path d="M144 9 H236"/>
    <path d="M96 9 q10 -7 18 0 q-10 7 -18 0 z"/>
    <path d="M144 9 q-10 -7 -18 0 q10 7 18 0 z"/>
  </g>
  <circle cx="120" cy="9" r="3.2" fill="#c9a227"/>
</svg>
