<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Seamless star tile. Every star is a point with no stroke crossing an
       edge, and nothing sits within 8px of one, so tiled copies never show a
       seam or a doubled star along the join. Varied radius AND opacity is what
       reads as depth — a field of identical dots reads as a texture swatch. -->
  <g fill="#ffffff">
    <circle cx="24"  cy="38"  r="1.5" opacity=".85"/>
    <circle cx="61"  cy="14"  r="0.8" opacity=".45"/>
    <circle cx="98"  cy="52"  r="1.1" opacity=".65"/>
    <circle cx="141" cy="27"  r="0.7" opacity=".38"/>
    <circle cx="186" cy="46"  r="1.6" opacity=".9"/>
    <circle cx="18"  cy="92"  r="0.9" opacity=".5"/>
    <circle cx="74"  cy="80"  r="1.3" opacity=".72"/>
    <circle cx="119" cy="104" r="0.7" opacity=".4"/>
    <circle cx="167" cy="88"  r="1.0" opacity=".58"/>
    <circle cx="203" cy="118" r="0.8" opacity=".46"/>
    <circle cx="40"  cy="131" r="1.7" opacity=".95"/>
    <circle cx="88"  cy="152" r="0.9" opacity=".52"/>
    <circle cx="132" cy="139" r="1.2" opacity=".68"/>
    <circle cx="176" cy="163" r="0.7" opacity=".36"/>
    <circle cx="30"  cy="181" r="1.0" opacity=".6"/>
    <circle cx="66"  cy="203" r="0.8" opacity=".44"/>
    <circle cx="110" cy="190" r="1.4" opacity=".8"/>
    <circle cx="154" cy="208" r="0.9" opacity=".5"/>
    <circle cx="197" cy="185" r="1.1" opacity=".64"/>
  </g>
  <!-- Two faint blue giants, for the colour variation real starfields have. -->
  <g fill="#9fc4ff">
    <circle cx="52"  cy="60"  r="1.2" opacity=".55"/>
    <circle cx="149" cy="122" r="1.0" opacity=".48"/>
  </g>
</svg>
