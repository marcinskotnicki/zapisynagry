<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420"
     preserveAspectRatio="xMidYMax slice">
  <!-- The limb of a world seen from low orbit: a sphere so large that only its
       top curve enters the frame, which is what sells the scale. The lit side
       is offset to the upper-left so the terminator falls across the visible
       arc rather than sitting flat.
       Sits at the FOOT of the page, fixed, with all content floating above. -->
  <defs>
    <radialGradient id="body" cx="34%" cy="8%" r="88%">
      <stop offset="0%"   stop-color="#3f6ea8"/>
      <stop offset="42%"  stop-color="#1f3b63"/>
      <stop offset="78%"  stop-color="#101f36"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#58a6e8" stop-opacity=".55"/>
      <stop offset="55%"  stop-color="#58a6e8" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#58a6e8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Atmosphere: a band hugging the limb, brightest right at the surface. -->
  <ellipse cx="800" cy="1180" rx="1180" ry="1010" fill="url(#halo)"/>
  <ellipse cx="800" cy="1200" rx="1140" ry="980" fill="url(#body)"/>
  <!-- Cloud banding, clipped to the body so it never spills past the limb. -->
  <g opacity=".16" fill="#bcd8f5">
    <ellipse cx="620" cy="268" rx="330" ry="17"/>
    <ellipse cx="1010" cy="312" rx="270" ry="13"/>
    <ellipse cx="470" cy="352" rx="220" ry="11"/>
  </g>
  <!-- The bright rim itself: a hairline of scattered light on the horizon. -->
  <ellipse cx="800" cy="1200" rx="1140" ry="980" fill="none"
           stroke="#8ec5f5" stroke-opacity=".5" stroke-width="2"/>
</svg>
