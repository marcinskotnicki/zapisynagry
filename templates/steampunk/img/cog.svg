  <!-- A machined gear, used very large and very faint as the ambient layer.
       The tooth outline is GENERATED, not eyeballed: 28 teeth, each wider at
       the root than the tip with curved flanks and a rounded crown, following
       the involute profile real gears use. Square teeth are the tell that a
       gear was drawn rather than engineered — and this app's audience contains
       rather a lot of engineers. -->
