<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Film grain for the page ground. stitchTiles="stitch" is what makes the
       turbulence tile seamlessly — without it every 180px boundary shows a
       visible seam in the noise. Desaturated so the grain reads as grit in the
       finish rather than as coloured speckle over a warm palette. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.09"/>
</svg>
