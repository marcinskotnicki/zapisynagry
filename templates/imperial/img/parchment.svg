<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Seamless fibre + foxing tile for the parchment panels. stitchTiles
       keeps the turbulence continuous across the join; the two layers are
       different frequencies so the grain reads as fibre rather than as noise. -->
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.045" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="fox" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix"
      values="0 0 0 0 0.42  0 0 0 0 0.34  0 0 0 0 0.19  0 0 0 0.42 0"/>
  </filter>
  <rect width="200" height="200" filter="url(#fox)" opacity="0.5"/>
  <rect width="200" height="200" filter="url(#fibre)" opacity="0.10"/>
</svg>
