<svg xmlns="http://www.w3.org/2000/svg" width="120" height="150" viewBox="0 0 120 150">
  <!-- Purity seal: two wax-stained ribbons hanging from a pressed wax disc.
       The DISC is deliberately empty in the middle — the card stamps the
       game's weight into it as live text, so the seal reports real data
       instead of being a sticker. -->
  <defs>
    <radialGradient id="wax" cx="36%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#c4392c"/>
      <stop offset="55%"  stop-color="#8c1c13"/>
      <stop offset="100%" stop-color="#4d0d07"/>
    </radialGradient>
    <linearGradient id="vellum" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#e8dfc4"/>
      <stop offset="60%"  stop-color="#cdc2a2"/>
      <stop offset="100%" stop-color="#a9a084"/>
    </linearGradient>
  </defs>
  <!-- Ribbons: two strips of stamped parchment, hanging at slightly different
       angles and lengths, because a hand pressed them there. -->
  <g stroke="#8a7f62" stroke-width="1">
    <path d="M46 56 L38 146 L56 150 L62 58 Z" fill="url(#vellum)"/>
    <path d="M62 56 L74 140 L90 134 L78 54 Z" fill="url(#vellum)"/>
  </g>
  <!-- Faint ruled lines on the ribbons: illegible small print, the way the
       real thing carries litanies nobody reads. -->
  <g stroke="#8a7f62" stroke-width="0.8" opacity=".55">
    <path d="M42 74 L59 75"/><path d="M41 86 L58 87"/><path d="M40 98 L57 99"/>
    <path d="M39 110 L56 111"/><path d="M67 72 L79 70"/><path d="M69 84 L81 82"/>
    <path d="M71 96 L83 94"/><path d="M73 108 L85 106"/>
  </g>
  <!-- The wax disc, pressed slightly off-round because wax is. -->
  <circle cx="60" cy="42" r="34" fill="url(#wax)" stroke="#3d0a05" stroke-width="1.5"/>
  <circle cx="60" cy="42" r="27" fill="none" stroke="#5e1109" stroke-width="1.5" opacity=".8"/>
  <!-- Radiating press marks around the rim: the die's serration. -->
  <g stroke="#5e1109" stroke-width="1.6" opacity=".7">
    <path d="M60 10 V17"/><path d="M83 19 L78 24"/><path d="M92 42 H85"/>
    <path d="M83 65 L78 60"/><path d="M60 74 V67"/><path d="M37 65 L42 60"/>
    <path d="M28 42 H35"/><path d="M37 19 L42 24"/>
  </g>
</svg>
